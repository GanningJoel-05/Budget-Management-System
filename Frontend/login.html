<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Budget Management</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div id="toast-container"></div>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">💰</div>
        <h1>Budget Management</h1>
        <p>Welcome back - sign in to continue</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <div class="field-meta">
            <label for="password">Password</label>
            <a href="forgot.html">Forgot password?</a>
          </div>
          <div class="field-pw">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="pw-toggle" aria-label="Toggle password">👁</button>
          </div>
        </div>

        <div class="check-row">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span>Sign In</span>
        </button>

        <p class="msg error" id="loginMsg"></p>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Pre-fill remembered email
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('rememberedEmail');
      if (saved) {
        document.getElementById('email').value = saved;
        document.getElementById('rememberMe').checked = true;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;
      const btn      = document.getElementById('loginBtn');

      showMsg('loginMsg', '');

      if (!email || !password) {
        showMsg('loginMsg', 'Please fill in all fields.'); return;
      }

      setLoading(btn, true);
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const user = await res.json();
          localStorage.setItem('userId',   user.id);
          localStorage.setItem('fullName', user.fullName);
          localStorage.setItem('email',    user.email);
          if (remember) localStorage.setItem('rememberedEmail', email);
          else          localStorage.removeItem('rememberedEmail');
          showToast('Login successful! Redirecting…', 'success');
          setTimeout(() => window.location.href = 'index.html', 900);
        } else {
          const txt = await res.text();
          showMsg('loginMsg', txt || 'Invalid credentials. Please try again.');
        }
      } catch {
        showMsg('loginMsg', 'Cannot connect to server. Please try again.');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
