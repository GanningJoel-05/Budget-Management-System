<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Management System</title>
  <link rel="stylesheet" href="auth.css" />
  <style>
    html, body { overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100vh; }
    body::before, body::after { display: none; } /* replaced by canvas background below */

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px;
      background: rgba(7,11,20,0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 19px; font-weight: 800; letter-spacing: -0.3px;
      color: var(--text-primary);
      display: flex; align-items: center; gap: 9px;
    }
    .nav-logo .logo-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .nav-logo .accent-word {
      background: var(--gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn-nav-login {
      padding: 9px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-primary);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-nav-login:hover { border-color: var(--accent); background: rgba(99,210,255,0.06); }
    .btn-nav-cta {
      padding: 9px 22px;
      background: var(--gradient);
      border: none;
      border-radius: 999px;
      color: #06101a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(74,250,154,0.22);
      transition: filter 0.2s, transform 0.15s;
    }
    .btn-nav-cta:hover { filter: brightness(1.08); transform: translateY(-1px); }

    /* ── Animated network background ── */
    #netCanvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Hero ── */
    .hero {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 100px 24px 70px;
      max-width: 880px; margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(99,210,255,0.08);
      border: 1px solid rgba(99,210,255,0.25);
      font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .hero-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
      animation: dotPulse 1.8s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

    .hero h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 56px; font-weight: 800; letter-spacing: -1.5px;
      line-height: 1.12;
      margin-bottom: 22px;
    }
    .hero h1 .line-1 { display: block; color: var(--text-primary); }
    .hero h1 .line-2 {
      display: block;
      background: var(--gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero p.sub {
      font-size: 16.5px; line-height: 1.75;
      color: var(--text-secondary);
      max-width: 620px;
      margin-bottom: 40px;
    }

    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; margin-bottom: 56px; }
    .btn-hero-primary {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 15px 28px;
      background: var(--gradient);
      border: none; border-radius: 999px;
      color: #06101a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15.5px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(74,250,154,0.28);
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-hero-primary:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 16px 40px rgba(74,250,154,0.38); }
    .btn-hero-outline {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 15px 26px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-primary);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15.5px; font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .btn-hero-outline:hover { border-color: var(--accent); background: rgba(99,210,255,0.06); transform: translateY(-2px); }

    /* ── Feature row ── */
    .features {
      display: flex; justify-content: center; gap: 40px;
      flex-wrap: wrap;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      width: 100%; max-width: 560px;
    }
    .feature {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; font-size: 12.5px; color: var(--text-secondary);
    }
    .feature .feature-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    /* ── Responsive ── */
    @media(max-width: 720px) {
      .navbar { padding: 14px 18px; }
      .hero { padding: 64px 18px 50px; }
      .hero h1 { font-size: 36px; letter-spacing: -1px; }
      .hero p.sub { font-size: 15px; }
      .features { gap: 22px; }
    }
    @media(max-width: 420px) {
      .nav-logo { font-size: 16px; }
      .btn-nav-login { display: none; }
      .hero h1 { font-size: 30px; }
      .btn-hero-primary, .btn-hero-outline { width: 100%; justify-content: center; }
      .hero-actions { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <canvas id="netCanvas"></canvas>

  <nav class="navbar">
    <div class="nav-logo">
      <div class="logo-mark">💰</div>
      Budget<span class="accent-word">Pro</span>
    </div>
    <div class="nav-actions">
      <button class="btn-nav-login" onclick="window.location.href='login.html'">Login</button>
      <button class="btn-nav-cta" onclick="window.location.href='register.html'">Get Started</button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-badge"><span class="dot"></span> Track · Budget · Grow</div>

    <h1>
      <span class="line-1">Take Control of Your</span>
      <span class="line-2">Money &amp; Budget</span>
    </h1>

    <p class="sub">
      Log expenses, track income, and set monthly budgets — all in one clean dashboard.
      See exactly where your money goes and how much you have left to spend, in real time.
    </p>

    <div class="hero-actions">
      <button class="btn-hero-primary" onclick="window.location.href='register.html'">⚡ Start for Free</button>
      <button class="btn-hero-outline" onclick="window.location.href='login.html'">→ Sign In</button>
      <button class="btn-hero-outline" onclick="document.getElementById('features').scrollIntoView({behavior:'smooth'})">🎯 Explore Features</button>
    </div>

    <div class="features" id="features">
      <div class="feature"><div class="feature-icon">📊</div>Analytics</div>
      <div class="feature"><div class="feature-icon">🎯</div>Goals</div>
      <div class="feature"><div class="feature-icon">🔒</div>Secure</div>
      <div class="feature"><div class="feature-icon">📱</div>Responsive</div>
    </div>
  </section>

  <script>
    // ── Animated particle-network background ──────────────────────
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      w = canvas.width  = window.innerWidth;
      h = canvas.height = document.documentElement.scrollHeight;
    }

    function initParticles() {
      const count = Math.min(70, Math.floor((w * h) / 22000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.6 + 0.8,
      }));
    }

    function step() {
      ctx.clearRect(0, 0, w, h);
      const linkDist = 130;

      for (const p of particles) {
        if (!reduceMotion) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(99,210,255,0.55)';
        ctx.fill();
      }

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < linkDist) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(99,210,255,${0.12 * (1 - dist / linkDist)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(step);
    }

    resize();
    initParticles();
    requestAnimationFrame(step);
    window.addEventListener('resize', () => { resize(); initParticles(); });
  </script>
</body>
</html>
