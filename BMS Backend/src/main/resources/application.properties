
# =============================================
#   Budget Management System - App Config
# =============================================

# Server
server.port=8080

# ?? PostgreSQL Database ??????????????????????
spring.datasource.url=sample
spring.datasource.username=sample
spring.datasource.password=sample
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ??????????????????????????
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? Disable Spring Security default login ????
# (We handle auth manually via our own AuthController)
spring.security.user.name=sample
spring.security.user.password=sample

# ?? Jackson ???????????????????????????????????
# LocalDate serialization is handled by JacksonConfig.java (see config package)
# Jackson 3 (used by Spring Boot 4.x) does not support write-dates-as-timestamps property

# ?? Logging ??????????????????????????????????
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG